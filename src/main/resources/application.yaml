spring:
  application:
    name: manage-system-back

  # Docker Compose Postgres-i söndürür, aşağıdakı datasource istifadə olunur
  docker:
    compose:
      enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    # Railway-də DATABASE_URL dəyişəni varsa onu oxuyur, yoxdursa lokalda localhost-a qoşulur
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:102007fs}

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: sitebuilder-data
        hbm2ddl:
          create_namespaces: true