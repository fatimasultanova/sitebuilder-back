spring:
  application:
    name: manage-system-back

  # Docker Compose Postgres-i söndürür, aşağıdakı datasource istifadə olunur
  docker:
    compose:
      enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
    # Railway-də DATABASE_URL dəyişəni varsa onu oxuyur, yoxdursa lokalda localhost-a qoşulur
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:102007fs}

  jpa:
    open-in-view: false
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sitebuilder-data
        hbm2ddl:
          create_namespaces: true

  sql:
    init:
      mode: always

billing:
  provider: ${BILLING_PROVIDER:fake}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    provider: ${MAIL_PROVIDER:brevo}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
      connect-timeout: ${BREVO_CONNECT_TIMEOUT:3s}
      read-timeout: ${BREVO_READ_TIMEOUT:8s}
      max-retries: ${BREVO_MAX_RETRIES:2}
  auth:
    session-ttl: ${AUTH_SESSION_TTL:7d}
    password-reset-token-ttl: ${AUTH_RESET_TOKEN_TTL:30m}
    email-verification-token-ttl: ${AUTH_VERIFICATION_TOKEN_TTL:24h}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    password-reset-path: ${PASSWORD_RESET_PATH:/reset-password}
    email-verification-path: ${EMAIL_VERIFICATION_PATH:/verify-email}
    email-enabled: ${AUTH_EMAIL_ENABLED:false}
    from-email: "${AUTH_EMAIL_FROM:Site Builder <no-reply@sitebuilder.local>}"
    email-locale: ${AUTH_EMAIL_LOCALE:az}
    resend-cooldown: ${AUTH_RESEND_COOLDOWN:60s}